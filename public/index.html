<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cliente socket</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    </head>
    <body class="container">
        <h3 class="mt-2">HOLA CLIENTE DE SOCKET</h3>
        <hr>
        <div class="row">
            <div id="contenedor_texto" class="col-12">
                <p>
                    Estado del servidor:
                    <span id="estado_servidor_on" class="fg-success">ENCENDIDO</span>
                    <span id="estado_servidor_off" class="fg-danger">APAGADO</span>
                </p>
            </div>
        </div>
        <div class="row">
            <div class="col-6">
                <input type="text" id="texto_mensaje" class="form-control" placeholder="favor ingresar mensaje">
            </div>
            <div class="col-6">
                <button id="bt_envio" class="btn btn-primary">ENVIAR</button>
            </div>
        </div>
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
        <script type="text/javascript" src="./socket.io/socket.io.js"></script>
        <script type="text/javascript" src="./js/cliente-socket.js"></script>
    </body>
</html>
